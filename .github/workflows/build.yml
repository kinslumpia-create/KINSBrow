name: Build Kins Browser (Windows EXE)

# Jalan otomatis setiap kali ada push ke branch main,
# dan bisa juga dipicu manual lewat tab "Actions" -> "Run workflow"
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest   # <-- ini kuncinya: GitHub yang sediakan mesin Windows gratis

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Publish portable single-file EXE
        run: >
          dotnet publish ./KinsBrowser.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./dist

      - name: Upload EXE sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinsBrowser-portable
          path: dist/KinsBrowser.exe
          if-no-files-found: error

      # Opsional: kalau push-nya pakai tag versi (misal v1.0.0),
      # exe juga otomatis dilampirkan ke halaman "Releases" GitHub.
      - name: Attach ke GitHub Release (jika ada tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KinsBrowser.exe
